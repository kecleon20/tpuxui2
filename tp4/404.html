<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada | Coffea</title>
  <meta name="description" content="La página que buscás no existe. Volvé al inicio de Coffea.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/cat-cup-coffee.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos compartidos con la landing -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/header.css">
  <link rel="stylesheet" href="/css/components/footer.css">

  <!-- Estilos específicos de la página 404 -->
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-48) var(--space-16);
      background-color: var(--color-bg);
    }

    .error-content {
      max-width: 560px;
      margin-inline: auto;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--color-espresso);
      line-height: 1;
      margin-bottom: var(--space-24);
      letter-spacing: -0.02em;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--ls-h2);
      color: var(--color-espresso);
      margin-bottom: var(--space-16);
    }

    .error-desc {
      font-family: var(--font-body);
      font-size: var(--fs-md);
      line-height: var(--lh-normal);
      color: var(--color-muted);
      margin-bottom: var(--space-32);
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 40px;
      background-color: var(--color-espresso);
      color: var(--color-white);
      font-family: var(--font-body);
      font-size: var(--fs-md);
      font-weight: 500;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
      transition: transform var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .error-btn:hover {
      transform: translateY(-2px);
      background-color: var(--color-btn-hover-espresso);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .footer--compact .footer__grid {
      grid-template-columns: 1fr;
      gap: var(--space-16);
    }

    @media (min-width: 768px) {
      .footer--compact .footer__grid {
        grid-template-columns: 1fr auto;
        align-items: center;
      }
    }

    .footer--compact .footer__copy {
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- Header simplificado (mismo branding) -->
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="header__logo" aria-label="Coffea Inicio">coffea</a>
    </div>
  </header>

  <main id="main" class="error-main">
    <div class="error-content">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-desc">
        La página que buscás no existe o fue movida. Volvé al inicio para seguir explorando Coffea.
      </p>
      <a href="/" class="error-btn">Volver al inicio</a>
    </div>
  </main>

  <!-- Footer simplificado -->
  <footer class="footer footer--compact">
    <div class="container">
      <div class="footer__grid">
        <div class="footer__brand">
          <a href="/" class="footer__logo" aria-label="Coffea Inicio">Coffea</a>
        </div>
        <div class="footer__col">
          <p class="footer__copy">© 2026 Coffea. Todos los derechos reservados.</p>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
